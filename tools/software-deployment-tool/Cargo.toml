[package]
name = "software-deployment-rust"
version = "0.1.15"
edition = "2024"
description = "Native Windows Rust evaluation build based on CorpInstaller v80"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_Registry", "Win32_System_EventLog", "Win32_System_Time", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_Storage_FileSystem", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_IpHelper"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
wmi = "0.18.4"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
rusqlite = { version = "0.42", features = ["bundled"] }
roxmltree = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"


